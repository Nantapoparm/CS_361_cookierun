<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ประวัติคำขอ | ระบบเบิกค่าตอบแทน</title>
  <link rel="icon" href="assets/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/ui.css">
  <link rel="stylesheet" href="css/user.css">
</head>
<body class="app">
  <header class="topbar" data-mount="topbar"></header>
  <main class="main"><div class="content">

    <div class="page-head">
      <div>
        <div class="eyebrow">ประวัติคำขอ</div>
        <h1>คำขอของฉัน</h1>
        <p class="lead" id="lead"></p>
      </div>
      <div class="tools"><a class="btn" href="form.html" id="btnNew">สร้างคำขอใหม่</a></div>
    </div>

    <div class="filters" id="filters">
      <select id="fTerm" aria-label="ภาคการศึกษา"><option value="">ทุกภาคการศึกษา</option></select>
      <select id="fCycle" aria-label="รอบการเบิก">
        <option value="">ทุกรอบการเบิก</option>
        <option value="1">รอบที่ 1</option>
        <option value="2">รอบที่ 2</option>
      </select>
      <select id="fCourse" aria-label="วิชา"><option value="">ทุกวิชา</option></select>
      <select id="fStatus" aria-label="สถานะ"><option value="">ทุกสถานะ</option></select>
      <input type="search" id="fSearch" placeholder="ค้นหาเลขที่คำขอ…" aria-label="ค้นหาเลขที่คำขอ">
      <button type="button" class="link-btn" id="fClear" hidden>ล้างตัวกรอง</button>
    </div>
    <div class="counts" id="counts" role="group" aria-label="กรองตามสถานะ"></div>

    <div id="msg"></div>
    <div class="table-card" id="tableCard">
      <table class="dtable claims-list">
        <thead><tr><th>เลขที่</th><th>วิชา</th><th>งานเดือน</th><th>รอบการเบิก</th><th class="num">ชม.</th><th class="num">ยอดเบิก (บาท)</th><th>สถานะ</th><th></th></tr></thead>
        <tbody id="rows"></tbody>
        <tfoot id="foot"></tfoot>
      </table>
    </div>

    <div class="pager-bar">
      <span class="pager-info" id="pageInfo"></span>
      <nav class="pager" id="pager" aria-label="เลือกหน้า"></nav>
    </div>
  </div></main>
  <footer class="site-footer" data-mount="footer"></footer>

  <script src="javascript/core.js"></script>
  <script src="javascript/layout.js"></script>
  <script src="javascript/ui.js"></script>
  <script src="javascript/config.js"></script>
  <script src="javascript/auth.js"></script>
  <script src="javascript/api.js"></script>
  <script src="javascript/dashboard.js"></script>
</body>
</html>
