<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ปฏิทิน | ระบบเบิกค่าตอบแทน</title>
  <link rel="icon" href="assets/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/ui.css">
  <link rel="stylesheet" href="css/user.css">
</head>
<body class="app">
  <header class="topbar" data-mount="topbar"></header>
  <main class="main"><div class="content">

    <div class="page-head">
      <div>
        <div class="eyebrow" id="eyebrow">ปฏิทินคาบสอน</div>
        <h1 id="title">ปฏิทิน</h1>
        <p class="lead" id="lead"></p>
      </div>
      <div class="tools cal-tools">
        <div class="cal-legend" id="legend" hidden></div>
        <div class="seg" role="group" aria-label="มุมมอง">
          <button type="button" data-view="week" aria-pressed="false">สัปดาห์</button>
          <button type="button" data-view="month" aria-pressed="true">เดือน</button>
        </div>
        <div class="cal-nav">
          <button type="button" class="btn ghost sm" id="prev" aria-label="ก่อนหน้า">‹</button>
          <button type="button" class="btn ghost sm" id="today">วันนี้</button>
          <button type="button" class="btn ghost sm" id="next" aria-label="ถัดไป">›</button>
        </div>
        <a class="btn ghost" id="btnMakeup" href="makeup.html" hidden>สร้างแบบฟอร์มสอนชดเชย</a>
        <button type="button" class="btn" id="btnAdd">+ เพิ่มคาบสอน</button>
      </div>
    </div>

    <div id="msg"></div>
    <div class="cal-layout" id="layout">
      <div class="cal-main">
        <div class="cal-card" id="cal" aria-live="polite"></div>
      </div>
      <aside class="cal-side" id="side"></aside>
    </div>
  </div></main>
  <footer class="site-footer" data-mount="footer"></footer>

  <script src="javascript/core.js"></script>
  <script src="javascript/layout.js"></script>
  <script src="javascript/ui.js"></script>
  <script src="javascript/config.js"></script>
  <script src="javascript/auth.js"></script>
  <!-- ทดสอบในเครื่องก่อนมี auth.js ของคนที่ 1: โหลด auth.stub.js (ไม่อยู่ใน repo) ลบบรรทัดนี้ได้เมื่อ auth.js พร้อม -->
  <script>window.Auth || document.write('<script src="javascript/auth.stub.js"><\/script>');</script>
  <script src="javascript/api.js"></script>
  <script src="javascript/calendar.js"></script>
</body>
</html>
