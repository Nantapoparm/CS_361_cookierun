components:
  # ---------------------------------------------------------------
  # JWT Authorizer (Cognito) ผูกกับทุก operation ผ่าน security: cognitoJwt
  # API Gateway ตรวจลายเซ็น อายุ issuer และ aud/client_id ของ token ก่อนเรียก Lambda
  # ไม่มี token หรือ token ไม่ถูกต้อง -> 401 โดยไม่เรียก Lambda
  # ส่วนสิทธิ์ตามบทบาท (cognito:groups) ตรวจใน Lambda (#81)
  # ---------------------------------------------------------------
  securitySchemes:
    cognitoJwt:
      type: oauth2
      flows: {}
      x-amazon-apigateway-authorizer:
        type: jwt
        identitySource: $request.header.Authorization
        jwtConfiguration:
          issuer: https://cognito-idp.us-east-1.amazonaws.com/us-east-1_tGEzAfQt2
          audience:
            - 5ikoqjohoavik8c91f3ph9qeck

  responses:
    Unauthorized:
      description: ไม่มี token หรือ token ไม่ถูกต้อง/หมดอายุ (API Gateway ตอบเอง ไม่ผ่าน Lambda)
      content:
        application/json:
          example:
            message: Unauthorized
    Forbidden:
      description: เข้าสู่ระบบแล้วแต่ไม่มีสิทธิ์ (เช่น ไม่ใช่ admin หรือไม่พบผู้ใช้ที่ผูกกับ cognitoSub)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            success: false
            error: { code: FORBIDDEN, message: "ไม่มีสิทธิ์เข้าถึง" }
    BadRequest:
      description: ข้อมูลที่ส่งมาไม่ถูกต้อง
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            success: false
            error: { code: VALIDATION_ERROR, message: "hours ต้องมากกว่า 0" }
    NotFound:
      description: ไม่พบข้อมูล
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            success: false
            error: { code: NOT_FOUND, message: "ไม่พบคำขอ" }
    Conflict:
      description: สถานะปัจจุบันไม่อนุญาตให้ทำรายการนี้ (เช่น แก้ไขคำขอที่ยื่นแล้ว)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            success: false
            error: { code: INVALID_STATE, message: "คำขอนี้ถูกยื่นแล้ว ไม่สามารถแก้ไขได้" }
    ServerError:
      description: ข้อผิดพลาดฝั่งเซิร์ฟเวอร์ (เช่น เชื่อมต่อ RDS ไม่ได้)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            success: false
            error: { code: INTERNAL_ERROR, message: "เกิดข้อผิดพลาดภายในระบบ" }

  schemas:
    ClaimStatus:
      type: string
      enum: [draft, submitted, returned, approved, rejected, documents_received, sent_to_finance]
    ClaimInput:
      type: object
      required: [userId, role, term, billingCycle, items]
      properties:
        userId: { type: string, example: "u001" }
        role:
          type: string
          enum: [instructor, ta, student_helper]
        term: { type: string, example: "1-2569" }
        billingCycle:
          type: integer
          enum: [1, 2]
        items:
          type: array
          items:
            type: object
            required: [date, hours]
            properties:
              date: { type: string, format: date, example: "2026-09-15" }
              courseCode: { type: string, example: "CS361" }
              hours: { type: number, example: 3 }
              note: { type: string }
        attachments:
          type: array
          description: รายการ File Key หรือ URL ของหลักฐานที่จำเป็น
          items:
            type: string
          example: ["uploads/12345-file.pdf"]
    Claim:
      allOf:
        - $ref: '#/components/schemas/ClaimInput'
        - type: object
          properties:
            id: { type: string, example: "c001" }
            status: { $ref: '#/components/schemas/ClaimStatus' }
            totalHours: { type: number }
            totalAmount: { type: number }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
            submittedAt: { type: string, format: date-time, nullable: true }
    ClaimResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        data: { $ref: '#/components/schemas/Claim' }
    ClaimListResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        data:
          type: array
          items: { $ref: '#/components/schemas/Claim' }
    GenericListResponse:
      type: object
      properties:
