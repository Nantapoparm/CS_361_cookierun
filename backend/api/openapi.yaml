                  message: ส่งการเงินสำเร็จจำนวน 3 รายการ
                  updatedClaims: [c001, c002, c007]
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/ServerError' }
      x-amazon-apigateway-integration:
        type: AWS_PROXY
        httpMethod: POST
        payloadFormatVersion: '2.0'
        uri: arn:aws:apigateway:us-east-1:lambda:path/2015-03-31/functions/arn:aws:lambda:us-east-1:ACCOUNT_ID:function:cookierun-admin/invocations

components:
  # ---------------------------------------------------------------
  # JWT Authorizer (Cognito) ผูกกับทุก operation ผ่าน security: cognitoJwt
  # API Gateway ตรวจลายเซ็น อายุ issuer และ aud/client_id ของ token ก่อนเรียก Lambda
  # ไม่มี token หรือ token ไม่ถูกต้อง -> 401 โดยไม่เรียก Lambda
  # ส่วนสิทธิ์ตามบทบาท (cognito:groups) ตรวจใน Lambda (#81)
  # ---------------------------------------------------------------
  securitySchemes:
    cognitoJwt:
      type: oauth2
      flows: {}
      x-amazon-apigateway-authorizer:
        type: jwt
        identitySource: $request.header.Authorization
        jwtConfiguration:
          issuer: https://cognito-idp.us-east-1.amazonaws.com/us-east-1_tGEzAfQt2
          audience:
            - 5ikoqjohoavik8c91f3ph9qeck

  responses:
    Unauthorized:
      description: ไม่มี token หรือ token ไม่ถูกต้อง/หมดอายุ (API Gateway ตอบเอง ไม่ผ่าน Lambda)
      content:
        application/json:
          example:
            message: Unauthorized
    Forbidden:
      description: >-
        เข้าสู่ระบบแล้วแต่ไม่มีสิทธิ์ เช่น ไม่อยู่ในกลุ่มใดใน Cognito, ไม่พบผู้ใช้ที่ผูกกับ cognitoSub,
        บทบาทใน DB ไม่ตรงกับกลุ่ม, ไม่ใช่ admin หรือไม่ใช่เจ้าของคำขอ
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            success: false
            error: { code: FORBIDDEN, message: "ไม่มีสิทธิ์เข้าถึงคำขอนี้" }
    BadRequest:
      description: ข้อมูลที่ส่งมาไม่ถูกต้อง หรือผิดกฎการเบิก (เช่น เกินเพดานชั่วโมง)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            success: false
            error: { code: VALIDATION_ERROR, message: "กรุณาระบุ month ในรูปแบบ YYYY-MM" }
    NotFound:
      description: ไม่พบข้อมูล
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            success: false
            error: { code: NOT_FOUND, message: "ไม่พบคำขอ" }
    Conflict:
      description: สถานะปัจจุบันไม่อนุญาตให้ทำรายการนี้ หรือข้อมูลซ้ำ
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            success: false
            error: { code: INVALID_STATE, message: "สถานะปัจจุบัน (approved) ไม่อนุญาตให้ทำรายการนี้ (submit)" }
    ServerError:
      description: ข้อผิดพลาดฝั่งเซิร์ฟเวอร์ (เช่น เชื่อมต่อ RDS ไม่ได้ หรือยังไม่ได้ตั้ง Environment variables)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            success: false
            error: { code: INTERNAL_ERROR, message: "เกิดข้อผิดพลาดภายในระบบ" }

  schemas:
    ClaimStatus:
      type: string
      enum: [draft, submitted, returned, approved, rejected, documents_received, sent_to_finance]
    PrintMethod:
      type: string
      enum: [sign_with_staff, self_print]
      description: sign_with_staff = ยื่นแล้วไปเซ็นที่คณะ, self_print = พิมพ์และเซ็นเอง
    WorkItemInput:
      type: object
      required: [workDate, startTime, endTime]
      properties:
        workDate: { type: string, format: date, example: "2026-10-06", description: ต้องอยู่ในเดือน month }
        startTime: { type: string, example: "09:30", description: "HH:MM หรือ HH:MM:SS" }
        endTime: { type: string, example: "12:30", description: ต้องหลัง startTime และคาบวันเดียวกันห้ามเวลาซ้อนกัน }
        Remark: { type: string, maxLength: 50, description: หมายเหตุ (รับ remark ได้ด้วย) }
    ClaimCreateInput:
      type: object
      required: [offeringId, month, items]
      properties:
        offeringId: { type: integer, example: 7 }
        month: { type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$', example: "2026-10" }
        items:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/WorkItemInput' }
    ClaimUpdateInput:
      type: object
      properties:
        items:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/WorkItemInput' }
        offeringId: { type: integer, description: ใช้เฉพาะเมื่อคำขอยังไม่มีรายการ }
        month: { type: string, description: ใช้เฉพาะเมื่อคำขอยังไม่มีรายการ (YYYY-MM) }
    WorkItem:
      type: object
      properties:
        workId: { type: integer }
        workDate: { type: string, format: date }
        startTime: { type: string, example: "09:30" }
        endTime: { type: string, example: "12:30" }
        hours: { type: number, example: 3 }
        Remark: { type: string }
        date: { type: string, format: date, description: "V2: เท่ากับ workDate" }
        courseCode: { type: string, description: "V2: รหัสวิชา" }
        note: { type: string, nullable: true, description: "V2: เท่ากับ Remark" }
    Claim:
      type: object
      description: รูปแบบคำขอเดียวกันทุก Route (build_claims ใน Lambda Layer) ฟิลด์ V2 คงไว้ให้หน้าเว็บเดิม
      properties:
        claimId: { type: integer, example: 3 }
        id: { type: string, example: "c003", description: "V2: รหัสคำขอแบบมี prefix" }
        offeringId: { type: integer, nullable: true }
        sessionId: { type: integer, nullable: true }
        courseId: { type: string, nullable: true, example: CS361 }
        courseName: { type: string }
        semester: { type: integer, nullable: true }
        academicYear: { type: integer, nullable: true, description: ค่าตาม DB }
        month: { type: string, nullable: true, example: "2026-10", description: เดือนของรายการแรก }
        requesterName: { type: string }
        userId: { type: string }
        role: { type: string, enum: [instructor, ta, student_helper] }
        term: { type: string, example: "1-2569" }
        billingCycle: { type: integer, nullable: true, description: คำนวณจากวันที่ยื่น (null เมื่อเป็น draft) }
        cycle: { type: integer, nullable: true, description: เท่ากับ billingCycle }
        deadline: { type: string, format: date, nullable: true }
        items:
          type: array
          items: { $ref: '#/components/schemas/WorkItem' }
        status: { $ref: '#/components/schemas/ClaimStatus' }
        statusId: { type: integer }
        statusName: { type: string, example: "Pending Review", description: ชื่อสถานะใน DB }
        printMethod:
          allOf: [ { $ref: '#/components/schemas/PrintMethod' } ]
          nullable: true
        revision: { type: integer, nullable: true, description: จำนวนครั้งที่ยื่น (null เมื่อปิดบันทึกประวัติ) }
        printedAt: { type: string, format: date-time, nullable: true }
        totalHours: { type: number }
        totalAmount: { type: number, nullable: true, description: null เมื่อบางรายการไม่มีอัตราค่าตอบแทน }
        createdAt: { type: string, nullable: true, description: ไม่มีคอลัมน์ใน DB จึงเป็น null เสมอ }
        updatedAt: { type: string, format: date-time, nullable: true }
        submittedAt: { type: string, format: date-time, nullable: true }
        returnNote: { type: string, nullable: true, description: หมายเหตุจากเจ้าหน้าที่ เมื่อสถานะ returned / rejected }
        flaggedWorkIds: { type: array, items: { type: integer } }
        actions:
          type: array
          nullable: true
          description: มีเฉพาะ GET /admin/claims/{id}
          items: { $ref: '#/components/schemas/ClaimAction' }
      example:
        claimId: 3
        id: c003
        offeringId: 7
        sessionId: 2
        courseId: CS361
        courseName: Cloud Software Architecture
        semester: 1
        academicYear: 2569
        month: "2026-10"
        requesterName: สมชาย อยู่เย็น
        userId: u001
        role: instructor
        term: 1-2569
        billingCycle: 1
        cycle: 1
        deadline: "2026-11-05"
        items:
          - workId: 101
            workDate: "2026-10-06"
            startTime: "09:30"
            endTime: "12:30"
            hours: 3
            Remark: ""
            date: "2026-10-06"
            courseCode: CS361
            note: ""
        status: submitted
        statusId: 2
        statusName: Pending Review
        printMethod: sign_with_staff
        revision: 1
        printedAt: null
        totalHours: 3
        totalAmount: 3600
        createdAt: null
        updatedAt: "2026-10-27T17:00:00Z"
        submittedAt: "2026-10-27T17:00:00Z"
        returnNote: null
        flaggedWorkIds: []
        actions: null
    ClaimResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        data: { $ref: '#/components/schemas/Claim' }
    ClaimListResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        data:
          type: array
          items: { $ref: '#/components/schemas/Claim' }
    ClaimAction:
      type: object
      properties:
        action: { type: string, example: submitted, description: "submitted, approved, rejected, returned, documents_received, sent_to_finance, printed, print_method_changed" }
        fromStatus: { allOf: [ { $ref: '#/components/schemas/ClaimStatus' } ], nullable: true }
        toStatus: { allOf: [ { $ref: '#/components/schemas/ClaimStatus' } ], nullable: true }
        actor: { type: string }
        note: { type: string, nullable: true }
        workIds: { type: array, items: { type: integer }, description: "มีเฉพาะใน actions ของ GET /admin/claims/{id}" }
        createdAt: { type: string, format: date-time }
    TransitionResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        data:
          type: object
          properties:
            message: { type: string }
            from: { $ref: '#/components/schemas/ClaimStatus' }
            to: { $ref: '#/components/schemas/ClaimStatus' }
    AutofillPreview:
      type: object
      properties:
        claimId: { type: integer, nullable: true, description: null เสมอ (ยังไม่สร้างคำขอ) }
        existingClaimId: { type: integer, nullable: true, description: คำขอเดิมของวิชาและเดือนนี้ ถ้ามี }
        status: { type: string, example: draft }
        offeringId: { type: integer }
        courseId: { type: string }
        courseName: { type: string }
        sessionId: { type: integer }
        semester: { type: integer }
        academicYear: { type: integer }
        month: { type: string, example: "2026-10" }
        ratePerHour: { type: number }
        totalHours: { type: number }
        totalAmount: { type: number }
        items:
          type: array
          items:
            type: object
            properties:
              workId: { type: integer, nullable: true }
              historyId: { type: integer }
              workDate: { type: string, format: date }
              startTime: { type: string, example: "09:30" }
              endTime: { type: string, example: "12:30" }
              hours: { type: number }
              Remark: { type: string, description: '"สอนชดเชย" สำหรับคาบชดเชย' }
              kind: { type: string, enum: [regular, makeup] }
              room: { type: string }
    SchedulePeriod:
      type: object
      properties:
        historyId: { type: integer }
        courseId: { type: string }
        courseName: { type: string, nullable: true }
        startTime: { type: string, example: "2026-11-03T09:30:00" }
        endTime: { type: string, example: "2026-11-03T12:30:00" }
        description: { type: string, description: ว่างเมื่อเป็นค่าประเภทคาบ (ดู kind) }
        room: { type: string, nullable: true }
        sessionId: { type: integer, nullable: true }
        offeringId: { type: integer, nullable: true }
        kind: { type: string, enum: [regular, cancelled, makeup] }
    CourseOffering:
      type: object
      properties:
        courseId: { type: string }
        courseName: { type: string, nullable: true }
        offeringId: { type: integer }
        sessionId: { type: integer }
        semester: { type: integer }
        academicYear: { type: integer }
    MonthSchedule:
      type: object
      properties:
        month: { type: string, example: "2026-11" }
        count: { type: integer }
        periods: { type: array, items: { $ref: '#/components/schemas/SchedulePeriod' } }
        courses:
          type: array
          description: รายวิชาของภาคที่ตรงกับเดือนนั้นที่ผู้ใช้มีคาบสอน
          items: { $ref: '#/components/schemas/CourseOffering' }
        allCourses:
          type: array
          description: รายวิชาทั้งหมดของภาคที่ตรงกับเดือนนั้น (ไม่มีข้อมูลภาคนั้นใช้ภาคล่าสุด)
          items: { $ref: '#/components/schemas/CourseOffering' }
        offeringIds: { type: array, items: { type: integer } }
    ScheduleCreateInput:
      type: object
      required: [courseId, startTime, endTime]
      properties:
        courseId: { type: string, example: CS361 }
        startTime: { type: string, example: "2026-11-03T09:30:00", description: วันและเวลาเริ่ม (ISO 8601) }
        endTime: { type: string, example: "2026-11-03T12:30:00" }
        description: { type: string, description: "ว่าง = คาบปกติ, cancelled / งดสอน, makeup / สอนชดเชย" }
        room: { type: string }
        sessionId: { type: integer, default: 2 }
        repeatUntil: { type: string, format: date, description: สร้างซ้ำทุก 7 วันจนถึงวันนี้ (ไม่ส่ง = คาบเดียว) }
    ScheduleUpdateInput:
      type: object
      required: [courseId, startTime, endTime]
      properties:
        courseId: { type: string }
        startTime: { type: string, example: "2026-11-10T09:30:00" }
        endTime: { type: string, example: "2026-11-10T12:30:00" }
        description: { type: string, description: "ไม่ส่ง = ว่าง (คาบปกติ)" }
        room: { type: string, description: "ไม่ส่ง = ว่าง" }
    Term:
      type: object
      properties:
        id: { type: string, example: "1-2569" }
        name: { type: string, example: "ภาคการศึกษาที่ 1/2569" }
        billingCycles:
          type: array
          items:
            type: object
            properties:
              cycle: { type: integer }
              description: { type: string }
              startDay: { type: integer }
              lastDay: { type: integer }
    Rate:
      type: object
      properties:
        role: { type: string, enum: [instructor, ta, student_helper] }
        ratePerHour: { type: number }
        maxHours: { type: number, nullable: true, description: เพดานชั่วโมงต่อภาค }
        maxHoursHalfLoad: { type: number, nullable: true, description: ยังไม่มีข้อมูลใน DB จึงเป็น null เสมอ }
    ErrorResponse:
      type: object
      properties:
        success: { type: boolean, example: false }
        error:
          type: object
          properties:
            code: { type: string, enum: [VALIDATION_ERROR, UNAUTHORIZED, FORBIDDEN, NOT_FOUND, INVALID_STATE, INTERNAL_ERROR] }
            message: { type: string }
