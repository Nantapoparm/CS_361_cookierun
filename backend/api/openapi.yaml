        - { name: month, in: query, description: เดือนที่ทำงาน (workDate) รูปแบบ YYYY-MM, schema: { type: string } }
        - { name: offeringId, in: query, schema: { type: integer } }
        - { name: printMethod, in: query, schema: { $ref: '#/components/schemas/PrintMethod' } }
        - { name: q, in: query, description: ค้นหาด้วยชื่อ-นามสกุล หรือเลขที่คำขอ (เช่น c003 หรือ 3), schema: { type: string } }
      responses:
        '200':
          description: สำเร็จ
