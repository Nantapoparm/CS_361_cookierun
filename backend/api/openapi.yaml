      x-amazon-apigateway-integration:
        type: AWS_PROXY
        httpMethod: POST
        payloadFormatVersion: '2.0'
        uri: arn:aws:apigateway:us-east-1:lambda:path/2015-03-31/functions/arn:aws:lambda:us-east-1:ACCOUNT_ID:function:cookierun-admin/invocations

  /admin/claims/{id}/review:
    parameters:
      - name: id
        in: path
        required: true
        description: รหัสคำขอ รับทั้ง "c003" และ "3"
        schema: { type: string, example: "c003" }
    post:
      operationId: adminReviewClaim
      security: [ { cognitoJwt: [] } ]
      summary: ผลตรวจ approve / reject / return ของคำขอที่ submitted (AD4)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: { type: string, enum: [approve, reject, return] }
                note: { type: string, maxLength: 500, description: บังคับเมื่อ reject หรือ return }
                workIds:
                  type: array
                  description: แถวงาน (workId) ที่ถูกตีกลับ ใช้กับ reject / return ต้องอยู่ในคำขอนี้
                  items: { type: integer }
