        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/ServerError' }
      x-amazon-apigateway-integration:
        type: AWS_PROXY
        httpMethod: POST
        payloadFormatVersion: '2.0'
        uri: arn:aws:apigateway:us-east-1:lambda:path/2015-03-31/functions/arn:aws:lambda:us-east-1:ACCOUNT_ID:function:cookierun-admin/invocations

  /admin/claims/{id}/printed:
    parameters:
      - name: id
        in: path
        required: true
        description: รหัสคำขอ รับทั้ง "c003" และ "3"
        schema: { type: string, example: "c003" }
    post:
      operationId: adminMarkPrinted
      security: [ { cognitoJwt: [] } ]
      summary: บันทึกว่าเจ้าหน้าที่พิมพ์เอกสารแล้ว กันพิมพ์ซ้ำ (AD5)
      description: บันทึกลง claims_histories ไม่เปลี่ยนสถานะคำขอ ถ้าเคยบันทึกแล้วได้ 409
      responses:
