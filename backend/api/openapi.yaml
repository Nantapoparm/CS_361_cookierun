                  data:
                    type: object
                    properties:
                      counts:
                        type: object
                        description: จำนวนคำขอต่อสถานะ (key ตาม ClaimStatus) เฉพาะสถานะที่มีคำขอ
                        additionalProperties: { type: integer }
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/Claim' }
              example:
                success: true
                data:
                  counts: { submitted: 4, approved: 2, documents_received: 1 }
