openapi: 3.0.1
info:
  title: Teaching Compensation Claim API
  description: >-
    API สำหรับระบบเบิกค่าตอบแทนการสอน (CS361 V3) ทุก Route ต้องส่ง Cognito Token ใน Header Authorization
    request / response ในไฟล์นี้ตรงกับโค้ด Lambda ที่ deploy อยู่ (backend/lambda/) ถ้าแก้ Lambda ต้องแก้ไฟล์นี้ตาม
  version: 3.1.0

# ---------------------------------------------------------------
# CORS (API Gateway HTTP API จัดการ Preflight OPTIONS ให้เอง)
# หมายเหตุ: เมื่อเปิด CORS ที่ API Gateway แล้ว Lambda ไม่ต้องใส่ header CORS
# ---------------------------------------------------------------
x-amazon-apigateway-cors:
  allowOrigins:
    - https://d2ye2fegyyx6ls.cloudfront.net
    - http://localhost:3000
    - http://localhost:5500
    - http://localhost:8000
  allowMethods:
    - GET
    - POST
    - PUT
    - DELETE
    - OPTIONS
  allowHeaders:
    - Content-Type
    - Authorization   # Login: ส่ง token ผ่าน header Authorization
  maxAge: 3600

# ---------------------------------------------------------------
# หมายเหตุ: ทีมใช้ AWS Account เดียวกันผ่าน IAM User/Group และ Role ตามสิทธิ์
# ARN ของ Lambda ใช้ placeholder ACCOUNT_ID (ไม่ hard-code Account ID ลง Git)
# แทนค่าก่อน import ด้วย:
#   ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
#   sed "s/ACCOUNT_ID/$ACCOUNT_ID/g" openapi.yaml > /tmp/openapi-deploy.yaml
# เหตุผล: API Gateway ไม่แทนค่า ${aws:region} / ${aws:accountId} ให้ตอน import
# ---------------------------------------------------------------
paths:
  /claims:
    get:
      operationId: listClaims
      security: [ { cognitoJwt: [] } ]
      summary: รายการคำขอของผู้ใช้ที่เข้าสู่ระบบ (ใช้กับ Dashboard)
      parameters:
        - name: term
          in: query
          description: ภาคการศึกษา รูปแบบ ภาค-ปี เช่น 1-2569
          schema: { type: string, example: "1-2569" }
        - name: status
          in: query
          description: >-
            draft = ร่าง, submitted = ทุกคำขอที่ยื่นแล้ว (ไม่ใช่ draft)
            ค่าอื่นกรองตามสถานะนั้นตรง ๆ
          schema: { $ref: '#/components/schemas/ClaimStatus' }
        - name: statusId
          in: query
          description: กรองด้วย status.statusId ตรง ๆ (ใช้แทน status)
          schema: { type: integer }
        - name: userId
          in: query
          description: เฉพาะ admin ใช้ดูคำขอของผู้ใช้อื่น ผู้ใช้ทั่วไปส่ง userId ของผู้อื่นจะได้ 403
          schema: { type: string }
      responses:
        '200':
          description: สำเร็จ เรียงจากคำขอใหม่ไปเก่า
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClaimListResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/ServerError' }
      x-amazon-apigateway-integration:
        type: AWS_PROXY
        httpMethod: POST
        payloadFormatVersion: '2.0'
        uri: arn:aws:apigateway:us-east-1:lambda:path/2015-03-31/functions/arn:aws:lambda:us-east-1:ACCOUNT_ID:function:cookierun-getClaims/invocations
    post:
      operationId: createClaim
      security: [ { cognitoJwt: [] } ]
      summary: สร้างคำขอแบบกรอกเอง (status = draft) 1 คำขอ = 1 รายวิชา ต่อ 1 เดือน
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ClaimCreateInput' }
            example:
              offeringId: 7
              month: "2026-10"
              items:
                - workDate: "2026-10-06"
                  startTime: "09:30"
                  endTime: "12:30"
                  Remark: ""
      responses:
        '201':
          description: สร้างสำเร็จ
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClaimResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: ไม่พบรายวิชา (offeringId) หรือไม่พบผู้ใช้
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '409':
          description: มีคำขอของวิชานี้ในเดือนนี้อยู่แล้ว (ยกเว้นคำขอที่ถูกปฏิเสธ)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '500': { $ref: '#/components/responses/ServerError' }
      x-amazon-apigateway-integration:
        type: AWS_PROXY
        httpMethod: POST
        payloadFormatVersion: '2.0'
        uri: arn:aws:apigateway:us-east-1:lambda:path/2015-03-31/functions/arn:aws:lambda:us-east-1:ACCOUNT_ID:function:cookierun-createClaim/invocations

  /claims/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: รหัสคำขอ รับทั้ง "c003" และ "3"
        schema: { type: string, example: "c003" }
    get:
      operationId: getClaim
      security: [ { cognitoJwt: [] } ]
      summary: รายละเอียดคำขอ ผู้ใช้ทั่วไปดูได้เฉพาะของตนเอง admin ดูได้ทุกคำขอ
      responses:
        '200':
          description: สำเร็จ
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClaimResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }
      x-amazon-apigateway-integration:
        type: AWS_PROXY
        httpMethod: POST
        payloadFormatVersion: '2.0'
        uri: arn:aws:apigateway:us-east-1:lambda:path/2015-03-31/functions/arn:aws:lambda:us-east-1:ACCOUNT_ID:function:cookierun-getClaimById/invocations
    put:
      operationId: updateClaim
      security: [ { cognitoJwt: [] } ]
      summary: แก้ไขรายการงานของคำขอ (เฉพาะเจ้าของ และสถานะ draft หรือ returned)
      description: >-
        items ที่ส่งมาจะแทนที่รายการเดิมทั้งหมด ไม่ส่ง items = คืนคำขอปัจจุบันโดยไม่แก้
        วิชาและเดือนยึดตามรายการเดิม ส่ง offeringId และ month เฉพาะเมื่อคำขอยังไม่มีรายการ
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ClaimUpdateInput' }
            example:
              items:
                - workDate: "2026-10-06"
                  startTime: "09:30"
                  endTime: "12:00"
                  Remark: แก้เวลาเลิก
      responses:
        '200':
          description: แก้ไขสำเร็จ
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClaimResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/ServerError' }
      x-amazon-apigateway-integration:
        type: AWS_PROXY
        httpMethod: POST
        payloadFormatVersion: '2.0'
        uri: arn:aws:apigateway:us-east-1:lambda:path/2015-03-31/functions/arn:aws:lambda:us-east-1:ACCOUNT_ID:function:cookierun-updateClaim/invocations

  /claims/{id}/submit:
    parameters:
      - name: id
        in: path
        required: true
        description: รหัสคำขอ รับทั้ง "c003" และ "3"
        schema: { type: string, example: "c003" }
    post:
      operationId: submitClaim
      security: [ { cognitoJwt: [] } ]
      summary: ยื่นคำขอ (draft / returned → submitted) พร้อมเลือกช่องทางยื่นเอกสาร
      description: >-
        ตรวจวันที่เบิกซ้ำกับคำขออื่น (409), เพดานชั่วโมงต่อภาค และเพดานเงินต่อวัน (400)
        แล้วตั้ง dayClaim เป็นวันนี้ (เวลาไทย) ซึ่งใช้คำนวณ billingCycle และ deadline
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [printMethod]
              properties:
                printMethod: { $ref: '#/components/schemas/PrintMethod' }
            example:
              printMethod: sign_with_staff
      responses:
        '200':
          description: ยื่นสำเร็จ
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClaimResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/ServerError' }
      x-amazon-apigateway-integration:
        type: AWS_PROXY
        httpMethod: POST
        payloadFormatVersion: '2.0'
        uri: arn:aws:apigateway:us-east-1:lambda:path/2015-03-31/functions/arn:aws:lambda:us-east-1:ACCOUNT_ID:function:cookierun-submitClaim/invocations

  /terms:
    get:
      operationId: listTerms
      security: [ { cognitoJwt: [] } ]
      summary: ภาคการศึกษาที่มีใน course_offerings (ใหม่ไปเก่า) และรอบการเบิก
      responses:
        '200':
          description: สำเร็จ
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Term' }
              example:
                success: true
                data:
                  - id: 1-2569
                    name: ภาคการศึกษาที่ 1/2569
                    billingCycles:
                      - cycle: 1
                        description: ส่งเอกสารภายในวันที่ 5 ของเดือนถัดไป
                        lastDay: 5
                      - cycle: 2
                        description: ส่งเอกสารระหว่างวันที่ 6 ถึง 10
                        startDay: 6
                        lastDay: 10
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/ServerError' }
      x-amazon-apigateway-integration:
        type: AWS_PROXY
        httpMethod: POST
        payloadFormatVersion: '2.0'
        uri: arn:aws:apigateway:us-east-1:lambda:path/2015-03-31/functions/arn:aws:lambda:us-east-1:ACCOUNT_ID:function:cookierun-getTerms/invocations

  /rates:
    get:
      operationId: listRates
      security: [ { cognitoJwt: [] } ]
      summary: อัตราค่าตอบแทนและเพดานชั่วโมงต่อภาคของแต่ละบทบาท (session ตาม env SESSION_NAME ค่าเริ่มต้น normal)
      responses:
        '200':
          description: สำเร็จ
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Rate' }
              example:
                success: true
                data:
                  - role: instructor
                    ratePerHour: 1200
                    maxHours: 45
                    maxHoursHalfLoad: null
                  - role: ta
                    ratePerHour: 420
                    maxHours: 45
                    maxHoursHalfLoad: null
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/ServerError' }
      x-amazon-apigateway-integration:
        type: AWS_PROXY
        httpMethod: POST
        payloadFormatVersion: '2.0'
        uri: arn:aws:apigateway:us-east-1:lambda:path/2015-03-31/functions/arn:aws:lambda:us-east-1:ACCOUNT_ID:function:cookierun-getRates/invocations

  /uploads/presigned-url:
    get:
      operationId: getUploadPresignedUrl
      security: [ { cognitoJwt: [] } ]
      summary: ขอ S3 Presigned URL (PUT) อายุ 300 วินาที สำหรับอัปโหลดไฟล์หลักฐาน
      description: >-
        Frontend อัปโหลดไฟล์ตรงด้วย HTTP PUT ไปที่ uploadUrl (ถ้าส่ง contentType ต้องส่ง header Content-Type เดียวกัน)
        ไฟล์อยู่ใน bucket cookierun-uploads ใต้ uploads/<userId>/
      parameters:
        - name: filename
          in: query
          required: true
          description: ชื่อไฟล์ (รับ fileName หรือ file_name ได้ด้วย)
          schema: { type: string, example: "receipt.pdf" }
        - name: contentType
          in: query
          description: MIME Type ของไฟล์ เช่น application/pdf (รับ fileType ได้ด้วย)
          schema: { type: string }
      responses:
        '200':
          description: สำเร็จ
          content:
            application/json:
              example:
                success: true
                data:
                  uploadUrl: "https://cookierun-uploads.s3.amazonaws.com/uploads/u001/3f2a...-receipt.pdf?X-Amz-Algorithm=...&X-Amz-Expires=300&X-Amz-Signature=..."
                  fileKey: "uploads/u001/3f2a9c0e5b6d4e7f8a9b0c1d2e3f4a5b-receipt.pdf"
                  s3Bucket: cookierun-uploads
                  method: PUT
                  contentType: application/pdf
                  expiresIn: 300
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/ServerError' }
      x-amazon-apigateway-integration:
        type: AWS_PROXY
        httpMethod: POST
        payloadFormatVersion: '2.0'
        uri: arn:aws:apigateway:us-east-1:lambda:path/2015-03-31/functions/arn:aws:lambda:us-east-1:ACCOUNT_ID:function:cookierun-getPresignedUrl/invocations


  # ---------------------------------------------------------------
  # V3 Routes
  # Lambda ของ V3 ส่วนใหญ่รวมหลาย Route ไว้ในฟังก์ชันเดียวตามฟีเจอร์ และแยกการทำงานด้วย path / method
  # ยกเว้นปฏิทินคาบสอน (/schedule) ที่แยก Lambda ต่อ method
  # ---------------------------------------------------------------

  # ----- ปฏิทินคาบสอน (อาจารย์ / TA) #72 -----
  # คาบเก็บในตาราง teaching_histories ประเภทของคาบดูจาก description:
  #   '' หรือข้อความอื่น = regular, 'cancelled' / 'งดสอน' = cancelled, 'makeup' / 'สอนชดเชย' = makeup
  # Lambda กลุ่มนี้ตอบ 403 เมื่อไม่พบผู้ใช้ที่ผูกกับ cognitoSub (ไม่ได้ตรวจ cognito:groups)
  /schedule:
    get:
      operationId: getMonthSchedule
      security: [ { cognitoJwt: [] } ]
      summary: คาบของเดือนของผู้ใช้ และรายวิชาของภาคการศึกษาที่ตรงกับเดือนนั้น
      parameters:
        - name: month
          in: query
          required: true
          description: เดือนในรูปแบบ YYYY-MM
          schema: { type: string, example: "2026-11" }
      responses:
        '200':
          description: สำเร็จ
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: '#/components/schemas/MonthSchedule' }
              example:
                success: true
                data:
                  month: "2026-11"
                  count: 2
                  periods:
                    - historyId: 12
                      courseId: CS361
                      courseName: Cloud Software Architecture
                      startTime: "2026-11-03T09:30:00"
                      endTime: "2026-11-03T12:30:00"
                      description: ""
                      room: SC3-301
                      sessionId: 2
                      offeringId: 7
                      kind: regular
                    - historyId: 13
                      courseId: CS361
                      courseName: Cloud Software Architecture
                      startTime: "2026-11-10T09:30:00"
                      endTime: "2026-11-10T12:30:00"
                      description: ""
                      room: SC3-301
                      sessionId: 2
                      offeringId: 7
                      kind: cancelled
                  courses:
                    - { courseId: CS361, courseName: Cloud Software Architecture, offeringId: 7, sessionId: 2, semester: 1, academicYear: 2569 }
                  allCourses:
                    - { courseId: CS361, courseName: Cloud Software Architecture, offeringId: 7, sessionId: 2, semester: 1, academicYear: 2569 }
                  offeringIds: [7]
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/ServerError' }
      x-amazon-apigateway-integration:
        type: AWS_PROXY
        httpMethod: POST
        payloadFormatVersion: '2.0'
        uri: arn:aws:apigateway:us-east-1:lambda:path/2015-03-31/functions/arn:aws:lambda:us-east-1:ACCOUNT_ID:function:cookierun-getSchedule/invocations
    post:
      operationId: createSchedule
      security: [ { cognitoJwt: [] } ]
      summary: เพิ่มคาบ คาบเดียวหรือซ้ำทุกสัปดาห์จนถึง repeatUntil (ไม่เกิน 26 สัปดาห์ต่อครั้ง)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ScheduleCreateInput' }
            examples:
              regular:
                summary: คาบสอนปกติ ซ้ำทุกสัปดาห์
                value:
                  courseId: CS361
                  startTime: "2026-11-03T09:30:00"
                  endTime: "2026-11-03T12:30:00"
                  room: SC3-301
                  repeatUntil: "2026-12-15"
              makeup:
                summary: คาบสอนชดเชย
                value:
                  courseId: CS361
                  startTime: "2026-11-14T09:30:00"
                  endTime: "2026-11-14T12:30:00"
                  description: สอนชดเชย
                  room: SC3-301
      responses:
        '200':
          description: บันทึกสำเร็จ
          content:
            application/json:
              example:
                success: true
                data:
                  message: บันทึกประวัติการสอนสำเร็จ!
                  userId: u001
                  sessionId: 2
                  count: 7
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/ServerError' }
      x-amazon-apigateway-integration:
        type: AWS_PROXY
        httpMethod: POST
        payloadFormatVersion: '2.0'
        uri: arn:aws:apigateway:us-east-1:lambda:path/2015-03-31/functions/arn:aws:lambda:us-east-1:ACCOUNT_ID:function:cookierun-postSchedule/invocations

  /schedule/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: historyId ของคาบ
        schema: { type: string, example: "12" }
    put:
      operationId: updateSchedule
      security: [ { cognitoJwt: [] } ]
      summary: แก้ไขคาบของตนเอง ทำเครื่องหมายงดสอนด้วย description = cancelled
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ScheduleUpdateInput' }
            example:
              courseId: CS361
              startTime: "2026-11-10T09:30:00"
              endTime: "2026-11-10T12:30:00"
              description: cancelled
              room: SC3-301
      responses:
        '200':
          description: แก้ไขสำเร็จ
          content:
            application/json:
              example: { success: true, data: { message: แก้ไขคาบสอนสำเร็จ! } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: ไม่พบคาบ หรือไม่ใช่คาบของผู้ใช้
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '500': { $ref: '#/components/responses/ServerError' }
      x-amazon-apigateway-integration:
        type: AWS_PROXY
        httpMethod: POST
        payloadFormatVersion: '2.0'
        uri: arn:aws:apigateway:us-east-1:lambda:path/2015-03-31/functions/arn:aws:lambda:us-east-1:ACCOUNT_ID:function:cookierun-putSchedule/invocations
    delete:
      operationId: deleteSchedule
      security: [ { cognitoJwt: [] } ]
      summary: ลบคาบของตนเอง
      responses:
        '200':
          description: ลบสำเร็จ
          content:
            application/json:
              example: { success: true, data: { message: ลบคาบสอนสำเร็จ! } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: ไม่พบคาบ หรือไม่ใช่คาบของผู้ใช้
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '500': { $ref: '#/components/responses/ServerError' }
      x-amazon-apigateway-integration:
        type: AWS_PROXY
        httpMethod: POST
        payloadFormatVersion: '2.0'
        uri: arn:aws:apigateway:us-east-1:lambda:path/2015-03-31/functions/arn:aws:lambda:us-east-1:ACCOUNT_ID:function:cookierun-deleteSchedule/invocations

  # ----- เติมข้อมูลคำขออัตโนมัติ #82 -----
  /claims/autofill:
    post:
      operationId: autofillClaim
      security: [ { cognitoJwt: [] } ]
      summary: ร่างรายการงานจากปฏิทินของวิชาและเดือนที่เลือก (ยังไม่บันทึกคำขอ)
      description: >-
        คืนรายการคาบในเดือนนั้น (ไม่รวมคาบงดสอน) พร้อมชั่วโมงและยอดเงินโดยประมาณ ไม่ได้สร้างคำขอ
        หน้าเว็บนำ items ไปสร้างคำขอด้วย POST /claims ถ้ามีคำขอของวิชาและเดือนนี้อยู่แล้ว existingClaimId จะไม่เป็น null
        ไม่มีคาบในเดือนนั้น data = null
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [offeringId, month]
              properties:
                offeringId: { type: integer, example: 7 }
                month: { type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$', example: "2026-10" }
      responses:
        '200':
          description: สำเร็จ (data = null เมื่อเดือนนั้นไม่มีคาบ)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    allOf: [ { $ref: '#/components/schemas/AutofillPreview' } ]
                    nullable: true
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: ไม่พบรายวิชา (offeringId)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '500': { $ref: '#/components/responses/ServerError' }
      x-amazon-apigateway-integration:
        type: AWS_PROXY
        httpMethod: POST
        payloadFormatVersion: '2.0'
        uri: arn:aws:apigateway:us-east-1:lambda:path/2015-03-31/functions/arn:aws:lambda:us-east-1:ACCOUNT_ID:function:cookierun-autofillClaim/invocations

  # ----- ช่องทางยื่นและประวัติคำขอ #84 -----
  /claims/{id}/print-method:
    parameters:
      - name: id
        in: path
        required: true
        description: รหัสคำขอ รับทั้ง "c003" และ "3"
        schema: { type: string, example: "c003" }
    put:
      operationId: updatePrintMethod
      security: [ { cognitoJwt: [] } ]
      summary: เปลี่ยนช่องทางยื่นเอกสารของคำขอของตนเอง
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [printMethod]
              properties:
                printMethod: { $ref: '#/components/schemas/PrintMethod' }
            example:
              printMethod: sign_with_staff
      responses:
        '200':
          description: เปลี่ยนสำเร็จ
          content:
            application/json:
              example:
                success: true
                data:
                  message: เปลี่ยนช่องทางยื่นสำเร็จ
                  claimId: c003
                  printMethod: sign_with_staff
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }
      x-amazon-apigateway-integration:
        type: AWS_PROXY
        httpMethod: POST
        payloadFormatVersion: '2.0'
        uri: arn:aws:apigateway:us-east-1:lambda:path/2015-03-31/functions/arn:aws:lambda:us-east-1:ACCOUNT_ID:function:cookierun-claimWorkflow/invocations

  /claims/{id}/actions:
    parameters:
      - name: id
        in: path
        required: true
        description: รหัสคำขอ รับทั้ง "c003" และ "3"
        schema: { type: string, example: "c003" }
    get:
      operationId: listClaimActions
      security: [ { cognitoJwt: [] } ]
