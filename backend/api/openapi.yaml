openapi: 3.0.1
info:
  title: Teaching Compensation Claim API
  description: API สำหรับระบบเบิกค่าตอบแทนการสอน (CS361 V3) ทุก Route ต้องส่ง Cognito Token ใน Header Authorization
  version: 3.0.0

# ---------------------------------------------------------------
# CORS (API Gateway HTTP API จัดการ Preflight OPTIONS ให้เอง)
# หมายเหตุ: เมื่อเปิด CORS ที่ API Gateway แล้ว Lambda ไม่ต้องใส่ header CORS
# ---------------------------------------------------------------
x-amazon-apigateway-cors:
  allowOrigins:
    - https://d2ye2fegyyx6ls.cloudfront.net
    - http://localhost:3000
    - http://localhost:5500
    - http://localhost:8000
  allowMethods:
    - GET
    - POST
    - PUT
    - DELETE
    - OPTIONS
  allowHeaders:
    - Content-Type
    - Authorization   # Login: ส่ง token ผ่าน header Authorization
    - X-User-Id       # V2 เท่านั้น ลบออกเมื่อ Lambda เลิกอ่าน header นี้ (#81) และหน้าเว็บเลิกส่ง (#75)
  maxAge: 3600

# ---------------------------------------------------------------
# หมายเหตุ: ทีมใช้ AWS Account เดียวกันผ่าน IAM User/Group และ Role ตามสิทธิ์
# ARN ของ Lambda ใช้ placeholder ACCOUNT_ID (ไม่ hard-code Account ID ลง Git)
# แทนค่าก่อน import ด้วย:
#   ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
#   sed "s/ACCOUNT_ID/$ACCOUNT_ID/g" openapi.yaml > /tmp/openapi-deploy.yaml
# เหตุผล: API Gateway ไม่แทนค่า ${aws:region} / ${aws:accountId} ให้ตอน import
# ---------------------------------------------------------------
paths:
  /claims:
    get:
      operationId: listClaims
      security: [ { cognitoJwt: [] } ]
      summary: ดึงรายการคำขอ (ใช้กับ Dashboard)
      parameters:
        - name: userId
          in: query
          schema: { type: string }
        - name: term
          in: query
          description: รหัสภาคการศึกษา เช่น 1-2569
          schema: { type: string }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/ClaimStatus' }
      responses:
        '200':
          description: สำเร็จ
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClaimListResponse' }
              example:
                success: true
                data:
                - id: c001
                  userId: u001
                  role: instructor
                  term: 1-2569
                  billingCycle: 1
                  items:
                  - date: '2026-09-15'
                    courseCode: CS361
                    hours: 3
                    note: สอนปกติ
                  status: draft
                  totalHours: 3
                  totalAmount: 3600
                  createdAt: '2026-09-16T08:00:00Z'
                  updatedAt: '2026-09-16T08:00:00Z'
                  submittedAt: null
        '400': { $ref: '#/components/responses/BadRequest' }
        '500': { $ref: '#/components/responses/ServerError' }
      x-amazon-apigateway-integration:
        type: AWS_PROXY
        httpMethod: POST
        payloadFormatVersion: '2.0'
        uri: arn:aws:apigateway:us-east-1:lambda:path/2015-03-31/functions/arn:aws:lambda:us-east-1:ACCOUNT_ID:function:cookierun-getClaims/invocations
    post:
      operationId: createClaim
      security: [ { cognitoJwt: [] } ]
      summary: สร้างคำขอใหม่หรือบันทึกร่าง
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ClaimInput' }
            example:
              userId: u001
              role: instructor
              term: 1-2569
              billingCycle: 1
              items:
              - date: '2026-09-15'
                courseCode: CS361
                hours: 3
                note: สอนปกติ
      responses:
        '201':
          description: สร้างสำเร็จ (status = draft)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClaimResponse' }
              example:
                success: true
                data:
                  id: c001
                  userId: u001
                  role: instructor
                  term: 1-2569
                  billingCycle: 1
                  items:
                  - date: '2026-09-15'
                    courseCode: CS361
                    hours: 3
                    note: สอนปกติ
                  status: draft
                  totalHours: 3
                  totalAmount: 3600
                  createdAt: '2026-09-16T08:00:00Z'
                  updatedAt: '2026-09-16T08:00:00Z'
                  submittedAt: null
        '400': { $ref: '#/components/responses/BadRequest' }
        '500': { $ref: '#/components/responses/ServerError' }
      x-amazon-apigateway-integration:
        type: AWS_PROXY
        httpMethod: POST
        payloadFormatVersion: '2.0'
        uri: arn:aws:apigateway:us-east-1:lambda:path/2015-03-31/functions/arn:aws:lambda:us-east-1:ACCOUNT_ID:function:cookierun-createClaim/invocations

  /claims/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: getClaim
      security: [ { cognitoJwt: [] } ]
      summary: ดูรายละเอียดคำขอ (รวมสถานะ)
      responses:
        '200':
          description: สำเร็จ
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClaimResponse' }
              example:
                success: true
                data:
                  id: c001
                  userId: u001
                  role: instructor
                  term: 1-2569
                  billingCycle: 1
                  items:
                  - date: '2026-09-15'
                    courseCode: CS361
                    hours: 3
                    note: สอนปกติ
                  status: draft
                  totalHours: 3
                  totalAmount: 3600
                  createdAt: '2026-09-16T08:00:00Z'
                  updatedAt: '2026-09-16T08:00:00Z'
                  submittedAt: null
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }
      x-amazon-apigateway-integration:
        type: AWS_PROXY
        httpMethod: POST
        payloadFormatVersion: '2.0'
        uri: arn:aws:apigateway:us-east-1:lambda:path/2015-03-31/functions/arn:aws:lambda:us-east-1:ACCOUNT_ID:function:cookierun-getClaimById/invocations
    put:
      operationId: updateClaim
      security: [ { cognitoJwt: [] } ]
      summary: แก้ไขคำขอที่ยังเป็นร่าง
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ClaimInput' }
            example:
              userId: u001
              role: instructor
              term: 1-2569
              billingCycle: 1
              items:
              - date: '2026-09-15'
                courseCode: CS361
                hours: 4
                note: แก้ไขชั่วโมง
      responses:
        '200':
          description: แก้ไขสำเร็จ
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClaimResponse' }
              example:
                success: true
                data:
                  id: c001
                  userId: u001
                  role: instructor
                  term: 1-2569
                  billingCycle: 1
                  items:
                  - date: '2026-09-15'
                    courseCode: CS361
                    hours: 4
                    note: แก้ไขชั่วโมง
                  status: draft
                  totalHours: 4
                  totalAmount: 4800
                  createdAt: '2026-09-16T08:00:00Z'
                  updatedAt: '2026-09-16T10:00:00Z'
                  submittedAt: null
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/ServerError' }
      x-amazon-apigateway-integration:
        type: AWS_PROXY
        httpMethod: POST
        payloadFormatVersion: '2.0'
        uri: arn:aws:apigateway:us-east-1:lambda:path/2015-03-31/functions/arn:aws:lambda:us-east-1:ACCOUNT_ID:function:cookierun-updateClaim/invocations

  /claims/{id}/submit:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: submitClaim
      security: [ { cognitoJwt: [] } ]
      summary: ยื่นคำขอ (draft -> submitted)
      responses:
        '200':
          description: ยื่นสำเร็จ
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClaimResponse' }
              example:
                success: true
                data:
                  id: c001
                  userId: u001
                  role: instructor
                  term: 1-2569
                  billingCycle: 1
                  items:
                  - date: '2026-09-15'
                    courseCode: CS361
                    hours: 3
                    note: สอนปกติ
                  status: submitted
                  totalHours: 3
                  totalAmount: 3600
                  createdAt: '2026-09-16T08:00:00Z'
                  updatedAt: '2026-09-17T09:30:00Z'
                  submittedAt: '2026-09-17T09:30:00Z'
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/ServerError' }
      x-amazon-apigateway-integration:
        type: AWS_PROXY
        httpMethod: POST
        payloadFormatVersion: '2.0'
        uri: arn:aws:apigateway:us-east-1:lambda:path/2015-03-31/functions/arn:aws:lambda:us-east-1:ACCOUNT_ID:function:cookierun-submitClaim/invocations

  /terms:
    get:
      operationId: listTerms
      security: [ { cognitoJwt: [] } ]
      summary: ดึงข้อมูลภาคการศึกษาและรอบการเบิก
      responses:
        '200':
          description: สำเร็จ
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GenericListResponse' }
              example:
                success: true
                data:
                - id: 1-2569
                  name: ภาคการศึกษาที่ 1/2569
                  billingCycles:
                  - cycle: 1
                    description: ส่งเอกสารภายในวันที่ 5 ของเดือนถัดไป
                    lastDay: 5
                  - cycle: 2
                    description: ส่งเอกสารระหว่างวันที่ 6 ถึง 10
                    startDay: 6
                    lastDay: 10
        '500': { $ref: '#/components/responses/ServerError' }
      x-amazon-apigateway-integration:
        type: AWS_PROXY
        httpMethod: POST
        payloadFormatVersion: '2.0'
        uri: arn:aws:apigateway:us-east-1:lambda:path/2015-03-31/functions/arn:aws:lambda:us-east-1:ACCOUNT_ID:function:cookierun-getTerms/invocations

  /rates:
    get:
      operationId: listRates
      security: [ { cognitoJwt: [] } ]
      summary: ดึงอัตราค่าตอบแทน
      responses:
        '200':
          description: สำเร็จ
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GenericListResponse' }
              example:
                success: true
                data:
                - role: instructor
                  ratePerHour: 1200
                  maxHours: 45
                  maxHoursHalfLoad: null
                - role: ta
                  ratePerHour: 420
                  maxHours: 45
                  maxHoursHalfLoad: 22.5
                - role: student_helper
                  ratePerHour: 40
                  maxHours: 253
                  maxHoursHalfLoad: 127
        '500': { $ref: '#/components/responses/ServerError' }
      x-amazon-apigateway-integration:
        type: AWS_PROXY
        httpMethod: POST
        payloadFormatVersion: '2.0'
        uri: arn:aws:apigateway:us-east-1:lambda:path/2015-03-31/functions/arn:aws:lambda:us-east-1:ACCOUNT_ID:function:cookierun-getRates/invocations
  /uploads/presigned-url:
    get:
      operationId: getUploadPresignedUrl
      security: [ { cognitoJwt: [] } ]
      summary: ขอ S3 Presigned URL สำหรับอัปโหลดไฟล์หลักฐาน (เช่น PDF, รูปภาพ)
      description: Frontend อัปโหลดไฟล์ตรงด้วย HTTP PUT ไปที่ uploadUrl เข้า bucket สำหรับไฟล์หลักฐานโดยเฉพาะ (แยกจาก bucket ของ Frontend)
      parameters:
        - name: fileName
          in: query
          required: true
          description: ชื่อไฟล์ที่ต้องการอัปโหลด
          schema: { type: string }
        - name: contentType
          in: query
          required: true
          description: MIME Type ของไฟล์ เช่น image/jpeg, application/pdf
          schema: { type: string }
      responses:
        '200':
          description: สำเร็จ
          content:
            application/json:
              example:
                success: true
                data:
                  uploadUrl: "https://<uploads-bucket-name>.s3.amazonaws.com/uploads/12345-file.pdf?X-Amz-Algorithm=...&X-Amz-Signature=...&X-Amz-Expires=300"
                  fileKey: "uploads/12345-file.pdf"
        '500': { $ref: '#/components/responses/ServerError' }
      x-amazon-apigateway-integration:
        type: AWS_PROXY
        httpMethod: POST
        payloadFormatVersion: '2.0'
        uri: arn:aws:apigateway:us-east-1:lambda:path/2015-03-31/functions/arn:aws:lambda:us-east-1:ACCOUNT_ID:function:cookierun-getPresignedUrl/invocations


  # ---------------------------------------------------------------
  # V3 Routes (ร่าง Route ↔ Lambda รอคนที่ 2 (#72) และคนที่ 3 (#82–#84) ยืนยัน)
  # Lambda ของ V3 รวมหลาย Route ไว้ในฟังก์ชันเดียวตามฟีเจอร์ และแยกการทำงานด้วย event.routeKey
  # ---------------------------------------------------------------

  # ----- ปฏิทินคาบสอน (อาจารย์ / TA) #72 -----
  /schedule:
    get:
      operationId: getMonthSchedule
      security: [ { cognitoJwt: [] } ]
      summary: คาบของเดือน (ตารางสอนประจำ + งดสอน/สอนชดเชย) พร้อมสรุปคาบและชั่วโมงต่อวิชา
      parameters:
        - name: month
          in: query
          required: true
          description: เดือนในรูปแบบ YYYY-MM
          schema: { type: string, example: "2026-11" }
      responses:
        '200':
          description: สำเร็จ
          content:
            application/json:
              example:
                success: true
                data:
                  month: "2026-11"
                  periods:
                    - date: "2026-11-03"
                      historyId: 12
                      courseId: CS361
                      type: lecture
                      room: SC3-301
                      startTime: "09:30"
                      endTime: "12:30"
                      kind: regular
                    - date: "2026-11-10"
                      historyId: 12
                      courseId: CS361
                      kind: cancelled
                      exceptionId: 4
                      reason: ติดประชุม
                  summary:
                    - courseId: CS361
                      periods: 3
                      hours: 9
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/ServerError' }
      x-amazon-apigateway-integration:
        type: AWS_PROXY
        httpMethod: POST
        payloadFormatVersion: '2.0'
        uri: arn:aws:apigateway:us-east-1:lambda:path/2015-03-31/functions/arn:aws:lambda:us-east-1:ACCOUNT_ID:function:cookierun-schedule/invocations
    post:
      operationId: createSchedule
      security: [ { cognitoJwt: [] } ]
      summary: เพิ่มคาบสอนประจำ (เลือกให้ใช้กับทุกสัปดาห์ถัดไปในภาคได้)
      requestBody:
        required: true
        content:
          application/json:
            example:
              courseId: CS361
              type: lecture
              room: SC3-301
              startTime: "2026-11-03T09:30:00"
              endTime: "2026-11-03T12:30:00"
              repeatWeekly: true
      responses:
        '201': { description: สร้างสำเร็จ }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/ServerError' }
      x-amazon-apigateway-integration:
        type: AWS_PROXY
        httpMethod: POST
        payloadFormatVersion: '2.0'
        uri: arn:aws:apigateway:us-east-1:lambda:path/2015-03-31/functions/arn:aws:lambda:us-east-1:ACCOUNT_ID:function:cookierun-schedule/invocations

  /schedule/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    put:
      operationId: updateSchedule
      security: [ { cognitoJwt: [] } ]
      summary: แก้ไขคาบสอนประจำ (แก้ได้จนกว่าจะยื่นคำขอของเดือนนั้น)
      responses:
        '200': { description: แก้ไขสำเร็จ }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/ServerError' }
      x-amazon-apigateway-integration:
        type: AWS_PROXY
        httpMethod: POST
        payloadFormatVersion: '2.0'
        uri: arn:aws:apigateway:us-east-1:lambda:path/2015-03-31/functions/arn:aws:lambda:us-east-1:ACCOUNT_ID:function:cookierun-schedule/invocations
    delete:
      operationId: deleteSchedule
      security: [ { cognitoJwt: [] } ]
      summary: ลบคาบสอนประจำ
      responses:
        '200': { description: ลบสำเร็จ }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/ServerError' }
      x-amazon-apigateway-integration:
        type: AWS_PROXY
        httpMethod: POST
        payloadFormatVersion: '2.0'
        uri: arn:aws:apigateway:us-east-1:lambda:path/2015-03-31/functions/arn:aws:lambda:us-east-1:ACCOUNT_ID:function:cookierun-schedule/invocations

  /schedule/exceptions:
    post:
      operationId: createScheduleException
      security: [ { cognitoJwt: [] } ]
      summary: เพิ่มคาบงดสอนหรือคาบสอนชดเชย พร้อมเหตุผล
      requestBody:
        required: true
        content:
          application/json:
            example:
              kind: makeup
              historyId: 12
              originalDate: "2026-11-10"
              startTime: "2026-11-14T09:30:00"
              endTime: "2026-11-14T12:30:00"
              room: SC3-301
              reason: สอนชดเชยคาบวันที่ 10
      responses:
        '201': { description: สร้างสำเร็จ }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/ServerError' }
      x-amazon-apigateway-integration:
        type: AWS_PROXY
        httpMethod: POST
        payloadFormatVersion: '2.0'
        uri: arn:aws:apigateway:us-east-1:lambda:path/2015-03-31/functions/arn:aws:lambda:us-east-1:ACCOUNT_ID:function:cookierun-schedule/invocations

  /schedule/exceptions/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    put:
      operationId: updateScheduleException
      security: [ { cognitoJwt: [] } ]
      summary: แก้ไขคาบงดสอนหรือคาบสอนชดเชย
      responses:
        '200': { description: แก้ไขสำเร็จ }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/ServerError' }
      x-amazon-apigateway-integration:
        type: AWS_PROXY
        httpMethod: POST
        payloadFormatVersion: '2.0'
        uri: arn:aws:apigateway:us-east-1:lambda:path/2015-03-31/functions/arn:aws:lambda:us-east-1:ACCOUNT_ID:function:cookierun-schedule/invocations
    delete:
      operationId: deleteScheduleException
      security: [ { cognitoJwt: [] } ]
      summary: ลบคาบงดสอนหรือคาบสอนชดเชย
      responses:
        '200': { description: ลบสำเร็จ }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/ServerError' }
      x-amazon-apigateway-integration:
        type: AWS_PROXY
        httpMethod: POST
        payloadFormatVersion: '2.0'
        uri: arn:aws:apigateway:us-east-1:lambda:path/2015-03-31/functions/arn:aws:lambda:us-east-1:ACCOUNT_ID:function:cookierun-schedule/invocations

  # ----- ปฏิทินงาน (นักศึกษาช่วยงาน) #72 -----
  /work-days:
    get:
      operationId: listWorkDays
      security: [ { cognitoJwt: [] } ]
      summary: วันทำงานของเดือน (เก็บใน work_information ที่ claimId ยังว่าง)
      parameters:
        - name: month
          in: query
          required: true
          schema: { type: string, example: "2026-11" }
      responses:
        '200': { description: สำเร็จ }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/ServerError' }
      x-amazon-apigateway-integration:
        type: AWS_PROXY
        httpMethod: POST
        payloadFormatVersion: '2.0'
        uri: arn:aws:apigateway:us-east-1:lambda:path/2015-03-31/functions/arn:aws:lambda:us-east-1:ACCOUNT_ID:function:cookierun-workDays/invocations
    post:
      operationId: createWorkDay
      security: [ { cognitoJwt: [] } ]
      summary: เพิ่มวันทำงาน
      requestBody:
        required: true
        content:
          application/json:
            example:
              offeringId: 7
