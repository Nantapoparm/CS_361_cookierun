  # ----- PDF #83 -----
  /claims/{id}/pdf:
    parameters:
      - name: id
        in: path
        required: true
        description: รหัสคำขอ รับทั้ง "c003" และ "3"
        schema: { type: string, example: "c003" }
    get:
      operationId: getClaimPdf
      security: [ { cognitoJwt: [] } ]
      summary: สร้าง PDF ของคำขอ เก็บใน S3 และคืน Presigned URL อายุสั้น
      description: >-
        เจ้าของคำขอหรือ admin เท่านั้น type=claim สถานะ approved ขึ้นไปได้ฉบับจริง
        draft / submitted / returned ได้ฉบับตัวอย่าง (preview) และ rejected ได้ 409
        คำขอของนักศึกษาช่วยงานได้แบบฟอร์มเปล่าเสมอ
      parameters:
        - name: type
          in: query
          description: claim = แบบฟอร์มเบิก, blank = แบบฟอร์มเปล่า (makeup ยังไม่รองรับ ได้ 400)
          schema: { type: string, enum: [claim, blank], default: claim }
      responses:
        '200':
          description: สำเร็จ
          content:
            application/json:
              example:
                success: true
                data:
                  downloadUrl: "https://cookierun-uploads.s3.amazonaws.com/pdf/c003.pdf?X-Amz-Expires=300&X-Amz-Signature=..."
                  expiresIn: 300
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/ServerError' }
      x-amazon-apigateway-integration:
        type: AWS_PROXY
        httpMethod: POST
        payloadFormatVersion: '2.0'
        uri: arn:aws:apigateway:us-east-1:lambda:path/2015-03-31/functions/arn:aws:lambda:us-east-1:ACCOUNT_ID:function:cookierun-generatePdf/invocations

