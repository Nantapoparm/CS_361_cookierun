        uri: arn:aws:apigateway:us-east-1:lambda:path/2015-03-31/functions/arn:aws:lambda:us-east-1:ACCOUNT_ID:function:cookierun-admin/invocations

  /admin/claims/{id}/documents-received:
    parameters:
      - name: id
        in: path
        required: true
        description: รหัสคำขอ รับทั้ง "c003" และ "3"
        schema: { type: string, example: "c003" }
    post:
      operationId: adminDocumentsReceived
      security: [ { cognitoJwt: [] } ]
      summary: รับเอกสารที่เซ็นแล้ว approved → documents_received (AD5, AD7)
      responses:
        '200':
          description: เปลี่ยนสถานะสำเร็จ
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransitionResponse' }
              example:
                success: true
                data: { message: เปลี่ยนสถานะสำเร็จเป็น documents_received, from: approved, to: documents_received }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/ServerError' }
      x-amazon-apigateway-integration:
        type: AWS_PROXY
        httpMethod: POST
        payloadFormatVersion: '2.0'
        uri: arn:aws:apigateway:us-east-1:lambda:path/2015-03-31/functions/arn:aws:lambda:us-east-1:ACCOUNT_ID:function:cookierun-admin/invocations

  /admin/claims/send-to-finance:
    post:
      operationId: adminSendToFinance
      security: [ { cognitoJwt: [] } ]
      summary: ส่งการเงินเป็นชุด documents_received → sent_to_finance (AD6)
      description: ทำทั้งชุดใน Transaction เดียว ถ้าคำขอใดไม่พบหรือสถานะไม่ถูกต้อง จะไม่มีคำขอใดถูกเปลี่ยน
