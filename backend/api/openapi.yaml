  /admin/claims:
    get:
      operationId: adminListClaims
      security: [ { cognitoJwt: [] } ]
      summary: รายการคำขอทั้งหมด กรองและค้นหาได้ พร้อมจำนวนตามสถานะ (AD1, AD2)
      description: counts นับตามเดือน (month) อย่างเดียว ไม่ได้กรองตามเงื่อนไขอื่น
      parameters:
