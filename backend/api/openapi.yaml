      description: คืน array ว่างเมื่อ Lambda ปิดการบันทึกประวัติ (CLAIM_ACTIONS_ENABLED ไม่ใช่ 1)
      responses:
        '200':
          description: สำเร็จ เรียงจากเก่าไปใหม่
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/ClaimAction' }
              example:
                success: true
                data:
                  - action: submitted
                    fromStatus: draft
                    toStatus: submitted
